<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password | Phoenix Adventures</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .reset-card { max-width: 400px; width: 100%; }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">

  <div class="container d-flex justify-content-center">
    <div class="card reset-card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <img src="img/logo/logo.jpg" alt="Logo" height="60" class="mb-3">
          <h3 class="fw-bold">Create New Password</h3>
          <p class="text-muted small">Choose a strong password to secure your account.</p>
        </div>

        <form id="resetForm">
          <div class="mb-3">
            <label class="form-label small fw-bold">New Password</label>
            <input type="password" class="form-control" id="newPassword" minlength="8" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label small fw-bold">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
            <div id="passwordHelp" class="form-text text-danger d-none">Passwords do not match.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Update Password</button>
        </form>

        <div class="text-center mt-4">
          <a href="index.html" class="small text-decoration-none">Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    form.addEventListener('submit', function(e) {
      const pass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const help = document.getElementById('passwordHelp');

      if (pass !== confirm) {
        e.preventDefault();
        help.classList.remove('d-none');
      } else {
        help.classList.add('d-none');
        // Here you would send the new password to your backend
        alert("Password successfully updated! You can now log in.");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
