<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Phoenix Adventures | 2026 Trips</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Phoenix Adventures 2026 coach trips and book your next adventure.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/tours.css" rel="stylesheet">

</head>

<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("/navbar.html")
    .then(response => response.text())
    .then(html => {
        document.getElementById("navbar-placeholder").innerHTML = html;
    })
    .catch(err => console.error("Navbar error:", err));
});
</script>



<!-- Trips Section -->
<section id="trips" class="section bg-light py-5">

    <div class="container">

        <div class="text-center mb-5">
            <h2>Our 2026 Trips</h2>
            <p class="lead">
                Browse all available trips and book your place today.
            </p>
        </div>


        <!-- Bookeo Booking Widget -->
        <div class="bookeo-widget">

            <script src="https://bookeo.com/widget.js?a=3251LK3XY319BFE1C2AE7"></script>

        </div>


    </div>

</section>



<!-- Footer -->
<div id="footer-placeholder"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    fetch("/footer.html")
    .then(response => response.text())
    .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
    })
    .catch(err => console.error("Footer error:", err));

});
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
