              <div class="mb-3"><label class="small fw-bold">Email</label><input type="email" class="form-control" required></div>

<script>
  // Ensure the UI updates immediately after the navbar is loaded
  function syncUI() {
    const user = JSON.parse(localStorage.getItem('phoenix_user'));
    if (user) {
      document.getElementById('logged-out-ui').classList.add('d-none');
      document.getElementById('logged-in-ui').classList.remove('d-none');
      document.getElementById('nav-display-name').innerText = user.name;
      document.getElementById('nav-initial').innerText = user.name.charAt(0);
      
      // Update Modal
      document.getElementById('loginForm').classList.add('d-none');
      document.getElementById('bookings-view').classList.remove('d-none');
      document.getElementById('main-tab-btn').innerText = "My Bookings";
      document.getElementById('reg-tab-li').classList.add('d-none');
    }
  }

  // Handle Login Click
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const name = email === "admin@phoenix.com" ? "Admin User" : "Travel Explorer";
    localStorage.setItem('phoenix_user', JSON.stringify({name: name, email: email}));
    location.reload();
  });

  // Handle Register Click
  document.getElementById('regForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    localStorage.setItem('phoenix_user', JSON.stringify({name: name}));
    location.reload();
  });

  function logoutUser() {
    localStorage.removeItem('phoenix_user');
    location.reload();
  }

  function openBookings() {
    const bModal = new bootstrap.Modal(document.getElementById('loginModal'));
    bModal.show();
  }

  // Run sync on load
  syncUI();
</script>
