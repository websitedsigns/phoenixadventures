<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Industry News | Phoenix Adventures</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --brand:#2d8fdd;
      --brand-dark:#1b6fb8;
      --cta:#ff4500;
      --cta-dark:#e63900;
      --ink:#0b3a66;
    }
    html,body{ height:100%; }
    body{ font-family:"Poppins",sans-serif; background:#f6f8fb; color:#213547; }

    /* Navbar */
    .navbar-brand img{ height:48px; }
    .nav-link{ font-weight:600; }
    .btn-phoenix{ background:var(--cta); border:0; color:#fff; }
    .btn-phoenix:hover{ background:var(--cta-dark); color:#fff; }

    /* Page header */
    .page-hero{
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .kicker{
      letter-spacing:.08em; text-transform:uppercase; font-size:.85rem; color:var(--brand-dark);
    }

    /* Tools */
    .sticky-tools{
      position:sticky; top:64px; z-index:1020; /* below navbar */
      background:#fff; border:1px solid rgba(0,0,0,.06); border-radius:.75rem;
      padding:.75rem; box-shadow:0 6px 24px rgba(0,0,0,.06);
    }

    /* Cards */
    .news-card{ overflow:hidden; border:1px solid rgba(0,0,0,.06); }
    .news-card img{ width:100%; height:180px; object-fit:cover; }
    .news-card .source{ font-size:.8rem; color:var(--brand-dark); text-transform:uppercase; font-weight:700; }
    .news-card .title a{ color:inherit; text-decoration:none; }
    .news-card .title a:hover{ color:var(--cta); }
    .chip{
      display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.75rem;
      background:#eef6ff; color:#0b3a66; border:1px solid #d6e7ff;
    }

    /* Loading */
    .skeleton{
      background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);
      background-size:400% 100%; animation:skeleton 1.4s ease infinite; border-radius:.5rem;
    }
    @keyframes skeleton{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }

    /* Footer */
    footer{ border-top:1px solid rgba(0,0,0,.06); }

    /* Accessibility */
    .skip-link{ position:absolute; left:-9999px; }
    .skip-link:focus{ left:0; background:#000; color:#fff; padding:.5rem 1rem; z-index:2000; }
  </style>
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white sticky-top border-bottom shadow-sm-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/index.html">
        <img src="/img/logo/logo.png" alt="Phoenix Adventures" class="me-2"/>
        <span class="fw-bold" style="color:var(--ink)">Phoenix Adventures</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/trips.html">Trips</a></li>
          <li class="nav-item"><a class="nav-link" href="/boarding.html">Boarding Points</a></li>
          <li class="nav-item"><a class="nav-link" href="/moreinfo.html">More Info</a></li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-phoenix fw-bold px-3" href="/contact.html"><i class="bi bi-envelope-fill me-1"></i>Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page header -->
  <header class="page-hero py-4">
    <div class="container">
      <p class="kicker mb-1"> News</p>
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1 class="fw-bold mb-0" style="color:var(--ink)">Theme Park News</h1>
        <a class="btn btn-outline-primary" id="refreshTop"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main id="main" class="container my-4">

    <!-- Filters -->
    <div class="sticky-tools">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md">
          <label class="form-label mb-1">Search</label>
          <input id="search" type="search" class="form-control" placeholder="Search titles & summaries…">
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <label class="form-label mb-1">Source</label>
          <select id="source" class="form-select">
            <option value="">All sources</option>
          </select>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label mb-1">Sort</label>
          <select id="sort" class="form-select">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">Title A–Z</option>
          </select>
        </div>
        <div class="col-12 col-md-auto d-flex align-items-end">
          <button id="refresh" class="btn btn-outline-secondary w-100 w-md-auto"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="d-flex align-items-center gap-3 mt-3 mb-2 small text-muted">
      <span id="count">0 items</span>
      <span>•</span>
      <span>Updated <time id="updated">—</time></span>
    </div>

    <!-- Grid -->
    <div id="grid" class="row g-4">
      <!-- Skeletons -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card news-card">
          <div class="skeleton" style="height:180px;"></div>
          <div class="card-body">
            <div class="skeleton mb-2" style="height:12px; width:40%;"></div>
            <div class="skeleton mb-2" style="height:20px; width:90%;"></div>
            <div class="skeleton mb-2" style="height:20px; width:75%;"></div>
            <div class="skeleton" style="height:12px; width:30%;"></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4 d-none d-md-block">
        <div class="card news-card">
          <div class="skeleton" style="height:180px;"></div>
          <div class="card-body">
            <div class="skeleton mb-2" style="height:12px; width:40%;"></div>
            <div class="skeleton mb-2" style="height:20px; width:90%;"></div>
            <div class="skeleton mb-2" style="height:20px; width:75%;"></div>
            <div class="skeleton" style="height:12px; width:30%;"></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4 d-none d-lg-block">
        <div class="card news-card">
          <div class="skeleton" style="height:180px;"></div>
          <div class="card-body">
            <div class="skeleton mb-2" style="height:12px; width:40%;"></div>
            <div class="skeleton mb-2" style="height:20px; width:90%;"></div>
            <div class="skeleton mb-2" style="height:20px; width:75%;"></div>
            <div class="skeleton" style="height:12px; width:30%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty / error state -->
    <div id="status" class="text-center text-muted py-5 d-none"></div>
  </main>

  <footer class="py-4 bg-white">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div class="small">© <span id="year"></span> Phoenix Adventures LTD</div>
      <div class="small">Made with 🧡 for coaster nerds — follow our trips and updates.</div>
    </div>
  </footer>

  <script>
    const API = "news.php";
    let DATA = [];

    const elGrid = document.getElementById("grid");
    const elSearch = document.getElementById("search");
    const elSource = document.getElementById("source");
    const elSort = document.getElementById("sort");
    const elRefresh = document.getElementById("refresh");
    const elRefreshTop = document.getElementById("refreshTop");
    const elCount = document.getElementById("count");
    const elUpdated = document.getElementById("updated");
    const elStatus = document.getElementById("status");

    document.getElementById("year").textContent = new Date().getFullYear();

    async function load() {
      try {
        elStatus.classList.add("d-none");
        // Keep skeletons visible until load completes
        const res = await fetch(API + "?_=" + Date.now(), { cache: "no-store" });
        const json = await res.json();
        if (!Array.isArray(json)) throw new Error("Unexpected response");
        DATA = json;
        buildSourceFilter(DATA);
        render();
        elUpdated.textContent = new Date().toLocaleString("en-GB", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short", year: "numeric" });
      } catch (err) {
        elGrid.innerHTML = "";
        elStatus.textContent = "Failed to load news. Please try again.";
        elStatus.classList.remove("d-none");
      }
    }

    function buildSourceFilter(items) {
      const sources = [...new Set(items.map(i => i.source))].sort((a,b)=>a.localeCompare(b));
      elSource.innerHTML = '<option value="">All sources</option>' +
        sources.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    }

    function render() {
      const q = elSearch.value.trim().toLowerCase();
      const s = elSource.value;
      const sort = elSort.value;

      let items = DATA.filter(it => {
        const bySource = !s || it.source === s;
        const hay = ((it.title||"") + " " + (it.summary||"")).toLowerCase();
        const byQuery = !q || hay.includes(q);
        return bySource && byQuery;
      });

      if (sort === "new") items.sort((a,b)=> new Date(b.published||0) - new Date(a.published||0));
      if (sort === "old") items.sort((a,b)=> new Date(a.published||0) - new Date(b.published||0));
      if (sort === "az")  items.sort((a,b)=> (a.title||"").localeCompare(b.title||""));

      elCount.textContent = `${items.length} item${items.length===1?"":"s"}`;

      if (!items.length) {
        elGrid.innerHTML = "";
        elStatus.textContent = "No articles match your filters.";
        elStatus.classList.remove("d-none");
        return;
      } else {
        elStatus.classList.add("d-none");
      }

      elGrid.innerHTML = items.map(card).join("");
    }

    function card(it){
      const d = it.published ? new Date(it.published) : null;
      const when = d ? d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" }) : "";
      const host = safeHost(it.url);
      return `
        <div class="col-12 col-md-6 col-lg-4">
          <article class="card news-card h-100 shadow-sm">
            ${it.image ? `<img src="${attr(it.image)}" alt="">` : ""}
            <div class="card-body d-flex flex-column">
              <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="source">${esc(it.source||host)}</span>
                ${host ? `<span class="chip">${esc(host)}</span>` : ""}
              </div>
              <h2 class="h5 title mb-2">
                <a href="${attr(it.url)}" target="_blank" rel="noopener">${esc(it.title||"Untitled")}</a>
              </h2>
              ${it.summary ? `<p class="text-muted small mb-2">${esc(it.summary)}</p>` : ""}
              <div class="mt-auto d-flex align-items-center justify-content-between">
                ${when ? `<span class="small text-muted">${when}</span>` : `<span></span>`}
                <a class="stretched-link position-static btn btn-sm btn-outline-primary" href="${attr(it.url)}" target="_blank" rel="noopener">
                  Read <i class="bi bi-box-arrow-up-right ms-1"></i>
                </a>
              </div>
            </div>
          </article>
        </div>
      `;
    }

    function safeHost(url){
      try { return new URL(url).hostname.replace(/^www\./,''); } catch { return ""; }
    }
    function esc(s){ return s?.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) || ""; }
    function attr(s){ return s?.replace(/"/g,"&quot;") || ""; }

    // Events
    ["input","change"].forEach(ev => {
      elSearch.addEventListener(ev, render);
      elSource.addEventListener(ev, render);
      elSort.addEventListener(ev, render);
    });
    elRefresh.addEventListener("click", load);
    elRefreshTop.addEventListener("click", load);

    // Initial load
    load();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
