<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phoenix Adventures | Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore our fleet of luxury coaches for your next adventure.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/tours.css" rel="stylesheet"/>
<link href="navbar.html" rel="import"/>
</head> 

<body>
<!-- Navbar -->
  <div id="navbar-placeholder"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("/navbar.html")
        .then(r=>r.text())
        .then(html=>document.getElementById("navbar-placeholder").innerHTML = html)
        .catch(()=>{});
    });
  </script>

<!-- Hero -->
  <header class="hero d-flex align-items-center text-white text-center">
    <div class="container position-relative py-5">
        </div>
  </header>

  <!-- Welcome -->
  <section id="welcome" class="section bg-light">
    <div class="container">
      <div class="row justify-content-center mb-4">
        <div class="col-lg-8">
          <h2 class="mb-3 text-center">Our Fleet</h2>
          <p class="lead text-center">
            At Phoenix Adventures, we take pride in our fleet of luxury coaches, designed for your comfort and enjoyment. Each vehicle is equipped with modern amenities to ensure a pleasant journey, whether you're heading to a theme park or exploring new destinations.
          </p>
        </div>
      </div>

  <!-- Footer include -->
<div id="footer-placeholder"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("/footer.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      })
      .catch(err => console.error("Error loading footer:", err));
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
